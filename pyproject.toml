[project]
name = "wpp-research-llm-campaign-finetuning"
version = "1.0.0"
description = "Large Language Model fine-tuning pipeline for classification campaigns on Google Cloud Vertex AI."
authors = [
    { name = "Elektra Papazoglou" }
]
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "google-cloud-aiplatform>=1.70.0",
    "google-cloud-storage>=2.19.0",
    "google-genai>=1.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "scikit-learn>=1.5.0",
    "setuptools>=70.0.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9.0",
    "pre-commit>=4.1.0",
    "ruff>=0.15.0",
    "seaborn>=0.13.2",
    "ty>=0.0.15",
    "unsloth>=2026.2.1",
]

[project.optional-dependencies]
qwen = [
    "torch>=2.1.0",
    "transformers>=5.0.0rc3",
    "trl>=0.8.6",
    "datasets",
    "peft",
    "unsloth>=2026.2.1",
    "pandas",
    "tqdm"
]
gemma = [
    "torch>=2.1.0",
    "transformers>=5.0.0rc3",
    "trl>=0.8.6",
    "datasets",
    "accelerate",
    "protobuf",
    "sentencepiece",
    "huggingface_hub",
    "numpy==1.26.4",
]

[tool.setuptools.packages.find]
where = ["src"]
